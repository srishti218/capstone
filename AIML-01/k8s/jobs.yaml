apiVersion: batch/v1
kind: Job
metadata:
  name: fraud-replay
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-training-data
          image: fraud-detection-api:local
          imagePullPolicy: Never
          command: [sh, -c, "until test -s /training/train.parquet; do sleep 3; done"]
          volumeMounts:
            - name: training
              mountPath: /training
              readOnly: true
      containers:
        - name: producer
          image: fraud-detection-api:local
          imagePullPolicy: Never
          command: [python, -m, src.streaming.producer, --input, /training/train.parquet]
          env:
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: kafka:9092}
          volumeMounts:
            - name: training
              mountPath: /training
              readOnly: true
      volumes:
        - name: training
          persistentVolumeClaim:
            claimName: fraud-training
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fraud-drift-monitor
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: monitor
              image: fraud-detection-api:local
              imagePullPolicy: Never
              command: [sh, -ec, "test ! -s /training/train.parquet || exec python -m src.monitoring.retrain --input /training/train.parquet"]
              env:
                - {name: FRAUD_STATE_DIR, value: /state}
              volumeMounts:
                - name: state
                  mountPath: /state
                - name: training
                  mountPath: /training
                  readOnly: true
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: fraud-state
            - name: training
              persistentVolumeClaim:
                claimName: fraud-training
